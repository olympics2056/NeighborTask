<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeighborTask Concierge v3.2</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Stripe.js -->
<script src="https://js.stripe.com/v3/"></script>
<style>
/* Use system fonts - no external dependencies */
:root {
--font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
--font-display: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, sans-serif;
--banana-yellow: #FFE135;
--nano-black: #1A1A1A;
--paper-white: #FAFAFA;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font-sans); background: var(--paper-white); color: var(--nano-black); }
.brand-font { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.02em; }
.btn-banana { background: var(--banana-yellow); color: var(--nano-black); border: 2px solid var(--nano-black); 
box-shadow: 4px 4px 0 var(--nano-black); cursor: pointer; transition: all 0.1s; font-weight: 600; }
.btn-banana:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--nano-black); }
.btn-black { background: black; color: white; border: 2px solid black; padding: 12px 24px; 
border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.2s; }
.btn-black:hover { background: #333; }
.card-nano { background: white; border: 2px solid var(--nano-black); border-radius: 16px; 
box-shadow: 6px 6px 0 rgba(0,0,0,0.1); }
.chat-bubble-ai { background: white; border: 2px solid var(--nano-black); border-radius: 16px 16px 16px 0; 
box-shadow: 2px 2px 0 rgba(0,0,0,0.05); }
.chat-bubble-user { background: var(--banana-yellow); border: 2px solid var(--nano-black); 
border-radius: 16px 16px 0 16px; box-shadow: 2px 2px 0 rgba(0,0,0,0.1); }
.loader-dot { width: 8px; height: 8px; background: #9CA3AF; border-radius: 50%; 
animation: bounce 1.4s infinite ease-in-out both; }
.loader-dot:nth-child(1) { animation-delay: -0.32s; }
.loader-dot:nth-child(2) { animation-delay: -0.16s; }
@keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
.payment-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5);
display: flex; align-items: center; justify-content: center; z-index: 1000; }
.payment-card { background: white; border-radius: 16px; border: 2px solid var(--nano-black);
padding: 32px; max-width: 500px; width: 90%; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
.stripe-element { padding: 12px; border: 2px solid #E5E7EB; border-radius: 8px; margin: 12px 0; }
.stripe-element:focus-within { border-color: var(--banana-yellow); }
.badge { display: inline-block; padding: 4px 8px; border-radius: 12px; font-size: 11px; 
font-weight: 600; margin: 4px 4px 0 0; }
.badge-verified { background: #DBEAFE; color: #1E40AF; border: 1px solid #3B82F6; }
.badge-bg-check { background: #DCFCE7; color: #166534; border: 1px solid #22C55E; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ============ CONFIG ============
const BACKEND_URL = "YOUR_BACKEND_URL_HERE";
const STRIPE_PUBLIC_KEY = "pk_test_YOUR_PUBLISHABLE_KEY"; // Replace with your Stripe publishable key

// Initialize Stripe
const stripe = window.Stripe ? window.Stripe(STRIPE_PUBLIC_KEY) : null;

// ============ PAYMENT COMPONENT ============
const PaymentModal = ({ amount, jobData, onSuccess, onCancel }) => {
const [processing, setProcessing] = useState(false);
const [error, setError] = useState(null);
const cardElementRef = useRef(null);

useEffect(() => {
if (!stripe) return;

const elements = stripe.elements();
const cardElement = elements.create('card', {
style: {
base: {
fontSize: '16px',
color: '#1A1A1A',
'::placeholder': { color: '#9CA3AF' }
}
}
});

cardElement.mount('#card-element');
cardElementRef.current = { stripe, cardElement };

return () => cardElement.destroy();
}, []);

const handleSubmit = async (e) => {
e.preventDefault();
if (!cardElementRef.current) return;

setProcessing(true);
setError(null);

try {
// 1. Create payment intent on backend
const response = await fetch(BACKEND_URL, {
method: 'POST',
headers: { 'Content-Type': 'text/plain' },
body: JSON.stringify({
action: 'create_payment_intent',
amount: amount * 100, // Convert to cents
customer_email: jobData.email,
job_id: jobData.jobId || 'pending'
})
});

const data = await response.json();
if (!data.success) throw new Error(data.error);

// 2. Confirm payment with Stripe
const { error: stripeError, paymentIntent } = await cardElementRef.current.stripe.confirmCardPayment(
data.payment_intent.client_secret,
{
payment_method: {
card: cardElementRef.current.cardElement,
billing_details: {
email: jobData.email,
name: jobData.name
}
}
}
);

if (stripeError) throw new Error(stripeError.message);

// 3. Confirm with backend
await fetch(BACKEND_URL, {
method: 'POST',
headers: { 'Content-Type': 'text/plain' },
body: JSON.stringify({
action: 'confirm_payment',
payment_intent_id: paymentIntent.id,
job_id: jobData.jobId
})
});

onSuccess(paymentIntent);
} catch (err) {
setError(err.message);
setProcessing(false);
}
};

return (
<div className="payment-modal">
<div className="payment-card">
<h2 style={{marginBottom: '16px', fontSize: '24px', fontWeight: 'bold'}}>
🔒 Secure Payment
</h2>
<p style={{marginBottom: '24px', color: '#6B7280', fontSize: '14px'}}>
Your card will be authorized for <strong>${amount.toFixed(2)}</strong> but not charged until the job is completed.
</p>

<form onSubmit={handleSubmit}>
<div style={{marginBottom: '16px'}}>
<label style={{display: 'block', marginBottom: '8px', fontWeight: '600', fontSize: '14px'}}>
Card Information
</label>
<div id="card-element" className="stripe-element"></div>
</div>

{error && (
<div style={{padding: '12px', background: '#FEE2E2', border: '1px solid #EF4444',
borderRadius: '8px', marginBottom: '16px', color: '#991B1B', fontSize: '14px'}}>
❌ {error}
</div>
)}

<div style={{display: 'flex', gap: '12px'}}>
<button type="button" onClick={onCancel} disabled={processing}
style={{flex: 1, padding: '12px', border: '2px solid #E5E7EB', borderRadius: '8px',
background: 'white', cursor: 'pointer', fontWeight: '600'}}>
Cancel
</button>
<button type="submit" disabled={processing} className="btn-black" style={{flex: 1}}>
{processing ? 'Processing...' : `Authorize $${amount.toFixed(2)}`}
</button>
</div>
</form>

<div style={{marginTop: '24px', padding: '12px', background: '#F3F4F6', borderRadius: '8px', fontSize: '12px', color: '#6B7280'}}>
<div style={{display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '8px'}}>
<svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
<path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/>
</svg>
<strong>Payment Protection</strong>
</div>
<ul style={{paddingLeft: '20px', lineHeight: '1.6'}}>
<li>Your card is authorized but NOT charged yet</li>
<li>Payment only captured when job is completed</li>
<li>Full refund if job is cancelled</li>
<li>Secured by Stripe encryption</li>
</ul>
</div>
</div>
</div>
);
};

// ============ MAIN APP ============
const App = () => {
const [userMode, setUserMode] = useState('customer');
const [messages, setMessages] = useState([]);
const [input, setInput] = useState("");
const [isLoading, setIsLoading] = useState(false);
const [jobContext, setJobContext] = useState(null);
const [showPayment, setShowPayment] = useState(false);
const [pendingBooking, setPendingBooking] = useState(null);
const messagesEndRef = useRef(null);

useEffect(() => {
setJobContext(null);
setMessages([{
role: 'ai',
text: userMode === 'customer'
? "Hi neighbor! 👋 I'm NeighborTask Concierge v3.2 with AI property intelligence and secure payment processing. What can I help you with today?"
: "Ready to help neighbors? Let's set up your Helper profile and get you verified."
}]);
}, [userMode]);

useEffect(() => {
messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
}, [messages]);

const handlePaymentSuccess = async (paymentIntent) => {
setShowPayment(false);
setMessages(prev => [...prev, {
role: 'ai',
text: `✅ Payment authorized successfully!\n\nYour booking is confirmed. Job ID: ${pendingBooking.jobId}\n\nWe're matching you with a verified helper now. You'll receive:\n📧 Email confirmation\n📱 Text updates when helper is assigned\n\nYour card will only be charged after the job is completed to your satisfaction.`
}]);
};

const handleBookingConfirmation = (bookingData) => {
setPendingBooking(bookingData);
setShowPayment(true);
};

const callBackend = async (message, userMode, currentContext, history) => {
if (!BACKEND_URL || BACKEND_URL === "YOUR_BACKEND_URL_HERE") {
return mockCustomerAI(message, history, currentContext);
}

try {
const response = await fetch(BACKEND_URL, {
method: "POST",
headers: { "Content-Type": "text/plain" },
body: JSON.stringify({
action: "chat",
mode: userMode,
message: message,
context: currentContext,
history: history || []
})
});

if (!response.ok) throw new Error(`HTTP ${response.status}`);
const data = await response.json();
if (!data.success) throw new Error(data.error);

// Check if booking is ready for payment
if (data.ready_for_payment) {
handleBookingConfirmation(data.booking_data);
}

return {
text: data.text || "No response",
property: data.property,
visual: data.visual,
newContext: data.newContext || currentContext
};
} catch (error) {
console.error("Backend Error:", error);
return { text: "⚠ Connection error: " + error.message };
}
};

const mockCustomerAI = async (msg, h, ctx) => {
return new Promise(r => setTimeout(() => {
let res = { text: "", visual: null, newContext: ctx || {} };
const low = msg.toLowerCase();
if (!ctx?.service) {
if (low.includes("snow")) {
res.text = "I found your property - 2-car garage with an 80-foot driveway.\n\nHow much snow? (4-6\" / 6-10\" / 10+\")";
res.visual = "driveway";
res.newContext = { service: "Snow", step: "details" };
} else {
res.text = "I can help with Snow, Cleaning, Lawn, and more. What do you need?";
}
} else if (ctx.step === "details") {
res.text = "Perfect! Based on your property:\n\n✓ 80-ft driveway on corner lot\n✓ Estimated 30-40 min job\n✓ Price: $65-85\n\nReady to book? (Type 'yes' to continue)";
res.newContext.step = "confirm";
} else if (ctx.step === "confirm") {
res.text = "Great! I'll need your contact info:\n\nPlease provide:\n• Name\n• Email\n• Phone number";
res.newContext.step = "contact";
} else {
res.text = "Thanks! Opening secure payment...";
setTimeout(() => {
handleBookingConfirmation({
jobId: 'DEMO_' + Date.now(),
amount: 75,
name: 'Demo User',
email: 'demo@example.com'
});
}, 1000);
}
r(res);
}, 1000));
};

const handleSend = async (textOverride = null) => {
const text = textOverride || input;
if (!text.trim()) return;

const outgoingHistory = messages;
const newMsgs = [...messages, { role: 'user', text: text }];
setMessages(newMsgs);
setInput("");
setIsLoading(true);

try {
const response = await callBackend(text, userMode, jobContext, outgoingHistory);
setMessages(prev => [...prev, {
role: 'ai',
text: response.text,
visual: response.visual,
property: response.property
}]);
if (response.newContext) setJobContext(response.newContext);
} catch (error) {
setMessages(prev => [...prev, { role: 'ai', text: "Error. Try again?" }]);
} finally {
setIsLoading(false);
}
};

return (
<div style={{minHeight: '100vh', display: 'flex', flexDirection: 'column', background: 'var(--paper-white)'}}>
{showPayment && (
<PaymentModal
amount={pendingBooking.amount}
jobData={pendingBooking}
onSuccess={handlePaymentSuccess}
onCancel={() => setShowPayment(false)}
/>
)}

<div style={{width: '100%', background: 'white', borderBottom: '2px solid var(--nano-black)',
padding: '16px', position: 'sticky', top: 0, zIndex: 10}}>
<div style={{maxWidth: '48rem', margin: '0 auto', display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
<div style={{display: 'flex', alignItems: 'center', gap: '8px'}}>
<div style={{width: '32px', height: '32px', background: 'var(--banana-yellow)', borderRadius: '8px',
border: '2px solid black', display: 'flex', alignItems: 'center', justifyContent: 'center',
fontWeight: 'bold', fontSize: '20px'}}>N</div>
<span className="brand-font" style={{fontSize: '20px'}}>NeighborTask</span>
<span style={{fontSize: '10px', background: '#3B82F6', color: 'white', padding: '2px 6px',
borderRadius: '4px', fontWeight: 'bold'}}>v3.2</span>
<span style={{fontSize: '10px', background: '#22C55E', color: 'white', padding: '2px 6px',
borderRadius: '4px', fontWeight: 'bold'}}>🔒 Secure</span>
</div>
<button onClick={() => setUserMode(userMode === 'customer' ? 'helper' : 'customer')}
className="btn-banana" style={{padding: '6px 12px', fontSize: '14px', borderRadius: '20px'}}>
{userMode === 'customer' ? 'Helper Mode' : 'Customer Mode'}
</button>
</div>
</div>

<main style={{flex: 1, width: '100%', maxWidth: '48rem', margin: '0 auto', padding: '16px', display: 'flex', flexDirection: 'column'}}>
{userMode === 'customer' && messages.length < 3 && (
<div style={{marginBottom: '24px'}}>
<p style={{fontSize: '12px', fontWeight: 'bold', color: '#9CA3AF', textTransform: 'uppercase',
letterSpacing: '0.05em', marginBottom: '12px'}}>Popular Services</p>
<div style={{display: 'flex', gap: '8px', overflowX: 'auto', paddingBottom: '8px'}}>
{[
{i:"❄️",l:"Snow Removal",t:"I need snow removal"},
{i:"✨",l:"Cleaning",t:"I need house cleaning"},
{i:"🌸",l:"Lawn Care",t:"I need lawn mowing"}
].map((s,i) => (
<button key={i} onClick={() => handleSend(s.t)}
style={{display: 'flex', alignItems: 'center', gap: '8px', padding: '8px 16px',
background: 'white', border: '2px solid var(--nano-black)', borderRadius: '20px',
cursor: 'pointer', whiteSpace: 'nowrap'}}>
<span>{s.i}</span><span style={{fontWeight: 500}}>{s.l}</span>
</button>
))}
</div>
</div>
)}

<div style={{flex: 1, overflowY: 'auto', marginBottom: '16px', paddingRight: '8px'}}>
{messages.map((msg, idx) => (
<div key={idx} style={{display: 'flex', width: '100%', marginBottom: '16px',
justifyContent: msg.role === 'ai' ? 'flex-start' : 'flex-end'}}>
<div className={msg.role === 'ai' ? 'chat-bubble-ai' : 'chat-bubble-user'}
style={{maxWidth: '85%', padding: '16px'}}>
<p style={{fontSize: '14px', lineHeight: '1.625', whiteSpace: 'pre-wrap'}}>{msg.text}</p>
</div>
</div>
))}
{isLoading && (
<div style={{display: 'flex', justifyContent: 'flex-start', width: '100%', marginBottom: '16px'}}>
<div className="chat-bubble-ai" style={{padding: '16px', display: 'flex', gap: '4px'}}>
<div className="loader-dot"></div>
<div className="loader-dot"></div>
<div className="loader-dot"></div>
</div>
</div>
)}
<div ref={messagesEndRef} />
</div>

<div className="card-nano" style={{padding: '8px', display: 'flex', alignItems: 'center', gap: '8px'}}>
<input type="text" value={input} onChange={(e) => setInput(e.target.value)}
onKeyPress={(e) => e.key === 'Enter' && handleSend()}
placeholder="Type your address and what you need..."
style={{flex: 1, padding: '12px', outline: 'none', fontSize: '16px', background: 'transparent', border: 'none'}}
/>
<button onClick={() => handleSend()} className="btn-banana"
style={{width: '48px', height: '48px', borderRadius: '12px', display: 'flex',
alignItems: 'center', justifyContent: 'center'}}>
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
<line x1="22" y1="2" x2="11" y2="13"></line>
<polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
</svg>
</button>
</div>
<p style={{textAlign: 'center', fontSize: '11px', color: '#9CA3AF', marginTop: '8px'}}>
🔒 Powered by Stripe • Payments secured with bank-level encryption
</p>
</main>
</div>
);
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
