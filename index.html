// ============ ERROR BOUNDARY ============
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }

  static getDerivedStateFromError(error) {
    return { hasError: true, error };
  }

  componentDidCatch(error, errorInfo) {
    console.error("React Error:", error, errorInfo);
  }

  render() {
    if (this.state.hasError) {
      return (
        <div style={{padding: '40px', textAlign: 'center'}}>
          <h1 style={{color: 'var(--red)', marginBottom: '20px'}}>Something went wrong</h1>
          <p style={{marginBottom: '20px', color: '#666'}}>
            {this.state.error?.message || 'An unexpected error occurred'}
          </p>
          <button 
            onClick={() => window.location.reload()}
            className="btn-banana"
          >
            Reload Application
          </button>
        </div>
      );
    }

    return this.props.children;
  }
}

const PhotoUpload = ({ onUpload, userId, userType, photoType, label, multiple = false }) => {
  const [uploading, setUploading] = React.useState(false);
  const [uploaded, setUploaded] = React.useState([]);
  const [error, setError] = React.useState(null);

  const handleFileSelect = async (e) => {
    const files = Array.from(e.target.files);
    if (!files.length) return;

    setUploading(true);
    setError(null);

    try {
      for (const file of files) {
        // In a real app, you would upload to your backend
        // For demo, we'll simulate upload
        await new Promise(resolve => setTimeout(resolve, 500));
        
        const newUpload = {
          url: URL.createObjectURL(file),
          name: file.name,
          size: file.size
        };
        
        setUploaded(prev => [...prev, newUpload]);
        if (onUpload) onUpload(newUpload);
      }
    } catch (err) {
      setError('Upload failed. Please try again.');
      console.error('Upload error:', err);
    } finally {
      setUploading(false);
    }
  };

  return (
    <div>
      <label className="upload-area">
        <input 
          type="file" 
          onChange={handleFileSelect} 
          accept="image/*" 
          disabled={uploading}
          multiple={multiple}
        />
        {uploading ? (
          <div>
            <LoadingSpinner />
            <p style={{ marginTop: '8px' }}>Uploading...</p>
          </div>
        ) : (
          <div>
            <span style={{ fontSize: '32px' }}>📸</span>
            <p style={{ marginTop: '8px', fontWeight: '600' }}>{label}</p>
            <p style={{ fontSize: '12px', color: '#666' }}>
              {multiple ? 'Click to select multiple photos' : 'Click to select or drag & drop'}
            </p>
          </div>
        )}
      </label>
      
      {error && <ErrorMessage message={error} />}
      
      {uploaded.length > 0 && (
        <div style={{ marginTop: '12px' }}>
          <p style={{ fontSize: '14px', marginBottom: '8px', color: '#666' }}>
            Uploaded ({uploaded.length}):
          </p>
          <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
            {uploaded.map((upload, i) => (
              <div key={i} style={{ position: 'relative' }}>
                <img 
                  src={upload.url} 
                  alt={upload.name}
                  style={{ 
                    width: '80px', 
                    height: '80px', 
                    objectFit: 'cover', 
                    borderRadius: '8px', 
                    border: '2px solid var(--gray-200)' 
                  }} 
                />
                <button
                  onClick={() => {
                    const newUploaded = uploaded.filter((_, index) => index !== i);
                    setUploaded(newUploaded);
                  }}
                  style={{
                    position: 'absolute',
                    top: '-8px',
                    right: '-8px',
                    background: 'var(--red)',
                    color: 'white',
                    border: 'none',
                    borderRadius: '50%',
                    width: '20px',
                    height: '20px',
                    cursor: 'pointer',
                    fontSize: '12px'
                  }}
                >
                  ×
                </button>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
};

const LocationButton = ({ onLocationFound, isLoading }) => {
  const [locating, setLocating] = React.useState(false);

  const handleLocation = () => {
    if (locating || isLoading) return;
    
    setLocating(true);
    
    if ("geolocation" in navigator) {
      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          
          try {
            // Simulate reverse geocoding for demo
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            // In a real app, you would call your backend
            const mockAddress = `123 Main St, City, State ${Math.floor(Math.random() * 99999)}`;
            onLocationFound(mockAddress);
            
          } catch (err) {
            console.error("Geocoding error:", err);
            onLocationFound(`My location is: ${lat}, ${lng}`);
          }
          
          setLocating(false);
        },
        (error) => {
          console.error("Location error:", error);
          setLocating(false);
          
          switch(error.code) {
            case error.PERMISSION_DENIED:
              alert("Location permission denied. Please type your address or enable location services.");
              break;
            case error.POSITION_UNAVAILABLE:
              alert("Location information unavailable. Please type your address.");
              break;
            case error.TIMEOUT:
              alert("Location request timed out. Please type your address.");
              break;
            default:
              alert("Unable to get location. Please type your address.");
          }
        },
        { 
          enableHighAccuracy: true, 
          timeout: 15000,
          maximumAge: 0 
        }
      );
    } else {
      setLocating(false);
      alert("Location services not available in this browser. Please type your address.");
    }
  };

  return (
    <button
      onClick={handleLocation}
      disabled={locating || isLoading}
      className="btn-secondary"
      style={{
        marginBottom: '12px',
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'center',
        gap: '8px',
        width: '100%'
      }}
    >
      {locating ? (
        <>
          <LoadingSpinner size={16} />
          Locating...
        </>
      ) : (
        <>
          <span style={{ fontSize: '18px' }}>📍</span>
          Use My Current Location
        </>
      )}
    </button>
  );
};

  const [error, setError] = React.useState(null);
  const [activeTab, setActiveTab] = React.useState('active');

  const fetchJobs = React.useCallback(async () => {
    try {
      setLoading(true);

      await new Promise(resolve => setTimeout(resolve, 1000));

      const mockJobs = [

          helper_name: userType === 'customer' ? 'John Doe' : null,
          customer_name: userType === 'helper' ? 'Jane Smith' : null,

          customer_rating: null
        },
        {
          job_id: 'JOB_' + Math.floor(Math.random() * 10000),
          service_type: 'lawn_care',
          property_address: '456 Oak Ave',
          service_date: '2024-12-10',
          service_time: '2:00 PM',
          total_price: 45.00,
          status: 'completed',
          assigned_helper: userType === 'customer' ? 'Mike Johnson' : null,
          helper_name: userType === 'customer' ? 'Mike Johnson' : null,
          customer_name: userType === 'helper' ? 'Robert Brown' : null,
          helper_rating: '4.9',
          payment_completed: true,
          customer_rating: userType === 'customer' ? 5 : null
        }
      ];
      
      setJobs(mockJobs);
    } catch (err) {
      setError('Failed to load jobs. Please check your connection.');
      console.error('Fetch jobs error:', err);
    } finally {
      setLoading(false);
    }
  }, [userType]);

  React.useEffect(() => {
    fetchJobs();
  }, [fetchJobs]);

  const handleJobAction = async (jobId, action) => {
    try {
      console.log(`Job action: ${action} for job ${jobId}`);
      
      // Update local state
      setJobs(prev => prev.map(job => {
        if (job.job_id === jobId) {
          const updatedJob = { ...job };
          
          switch(action) {
            case 'accept':
              updatedJob.status = 'confirmed';
              break;
            case 'decline':
              updatedJob.status = 'cancelled';
              break;
            case 'complete':
              updatedJob.status = 'completed';
              break;
            case 'pay':
              updatedJob.payment_completed = true;
              break;
            case 'reviewed':
              updatedJob.customer_rating = 5;
              break;
          }
          
          return updatedJob;
        }
        return job;
      }));
      
    } catch (err) {
      console.error('Job action failed:', err);
    }
  };

  if (loading && jobs.length === 0) {
    return (
      <div style={{ textAlign: 'center', padding: '40px' }}>
        <LoadingSpinner size={40} />
        <p style={{ marginTop: '16px', color: '#666' }}>Loading jobs...</p>
      </div>
    );

  return (
    <div style={{padding: '20px'}}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '24px' }}>
        <h2>{userType === 'customer' ? 'My Jobs' : 'Available Jobs'}</h2>
        <button onClick={onBack} className="btn-secondary">← Back to Chat</button>
      </div>

      {error && <ErrorMessage message={error} onRetry={fetchJobs} />}

      <div className="tab-container">
        <button 
          className={`tab ${activeTab === 'active' ? 'active' : ''}`}
          onClick={() => setActiveTab('active')}
        >
          Active Jobs
        </button>
        <button 
          className={`tab ${activeTab === 'completed' ? 'active' : ''}`}
          onClick={() => setActiveTab('completed')}
        >
          Completed
        </button>
        <button 
          className={`tab ${activeTab === 'cancelled' ? 'active' : ''}`}
          onClick={() => setActiveTab('cancelled')}
        >
          Cancelled
        </button>
      </div>

      {jobs.length === 0 ? (
        <div style={{ textAlign: 'center', padding: '40px', color: '#666' }}>
          <p>No jobs found in this category.</p>
        </div>
      ) : (

      <div style={{ display: 'flex', gap: '12px' }}>
        <button 
          onClick={handleSubmit}
          className="btn-success"
          disabled={submitting}
        >
          {submitting ? <LoadingSpinner /> : 'Submit Review'}
        </button>
        <button 
          onClick={onClose}
          className="btn-secondary"
        >
          Cancel
        </button>
      </div>
    </div>
  );
};

const NotificationsPanel = ({ notifications, onClose, onClear }) => {
  const unreadCount = notifications.filter(n => !n.read).length;

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-content" onClick={e => e.stopPropagation()}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '24px' }}>
          <h3>Notifications {unreadCount > 0 && `(${unreadCount})`}</h3>
          <div style={{ display: 'flex', gap: '12px' }}>
            <button onClick={onClear} className="btn-secondary btn-small">
              Clear All
            </button>
            <button onClick={onClose} className="btn-secondary btn-small">
              Close
            </button>
          </div>
        </div>
        
        {notifications.length === 0 ? (
          <p style={{ textAlign: 'center', color: '#666', padding: '40px' }}>
            No notifications
          </p>
        ) : (
          <div style={{ maxHeight: '400px', overflowY: 'auto' }}>
            {notifications.map((notification, index) => (
              <div 
                key={index}
                style={{
                  padding: '16px',
                  background: notification.read ? 'white' : '#F0F9FF',
                  border: '1px solid var(--gray-200)',
                  borderRadius: '8px',
                  marginBottom: '8px',
                  opacity: notification.read ? 0.8 : 1
                }}
              >
                <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                  <strong>{notification.title}</strong>
                  <span style={{ fontSize: '12px', color: '#666' }}>
                    {new Date(notification.timestamp).toLocaleTimeString()}
                  </span>
                </div>
                <p style={{ marginTop: '8px', fontSize: '14px' }}>{notification.message}</p>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
};

  const [settings, setSettings] = React.useState({
    email_notifications: true,
    sms_notifications: true,
    whatsapp_notifications: true,

  });

    try {

      // Simulate API call

  return (

          <button onClick={handleSave} className="btn-success" disabled={saving}>
            {saving ? <LoadingSpinner /> : 'Save Changes'}

      <div className="setting-item">
        <div>

        <label className="toggle-switch">
          <input

      <div className="setting-item">
        <div>
          <strong>SMS Notifications</strong>
          <p style={{ fontSize: '14px', color: '#666', marginTop: '4px' }}>Receive job updates via SMS</p>
        </div>
        <label className="toggle-switch">
          <input 
            type="checkbox" 
            checked={settings.sms_notifications}

          />
          <span className="toggle-slider"></span>
        </label>
      </div>

      {userType === 'helper' && (
        <>
          <div className="setting-item">
            <div>
              <strong>Auto-Accept Jobs</strong>
              <p style={{ fontSize: '14px', color: '#666', marginTop: '4px' }}>Automatically accept jobs within your criteria</p>

              <input

                checked={settings.auto_accept_jobs}

              />
              <span className="toggle-slider"></span>
            </label>
          </div>

          <div className="setting-item">
            <div>
              <strong>Service Radius</strong>
              <p style={{ fontSize: '14px', color: '#666', marginTop: '4px' }}>Maximum distance to travel for jobs</p>

              <input 
                type="range" 
                min="5" 
                max="50"

                style={{ width: '200px' }}
              />
              <span>{settings.service_radius} miles</span>
            </div>
          </div>

          <div className="setting-item">
            <div>
              <strong>Hourly Rate</strong>
              <p style={{ fontSize: '14px', color: '#666', marginTop: '4px' }}>Your standard hourly rate</p>

            <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
              <span>$</span>
              <input 
                type="number" 
                value={settings.hourly_rate}
                onChange={(e) => setSettings({...settings, hourly_rate: parseInt(e.target.value) || 50})}
                style={{ 
                  width: '80px', 
                  padding: '8px', 
                  border: '2px solid var(--gray-200)', 
                  borderRadius: '4px' 
                }}
                min="15"
                max="200"
              />
              <span>/hour</span>
            </div>
          </div>
        </>
      )}
    </div>
  );
};

const Header = ({ userMode, onBack, onDashboard, onSettings, onNotifications, unreadCount, showLanding }) => {
  return (
    <div style={{background: 'white', borderBottom: '2px solid var(--nano-black)', padding: '16px', position: 'sticky', top: 0, zIndex: 10}}>
      <div style={{maxWidth: '1200px', margin: '0 auto', display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '0 20px', flexWrap: 'wrap', gap: '12px'}}>
        <div style={{display: 'flex', alignItems: 'center', gap: '8px'}}>
          <div style={{width: '36px', height: '36px', background: 'var(--banana-yellow)', borderRadius: '8px', border: '2px solid black', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '20px', fontWeight: 'bold'}}>N</div>
          <span style={{fontSize: '20px', fontWeight: 'bold'}}>NeighborTask</span>
        </div>
        
        <div style={{display: 'flex', gap: '12px', alignItems: 'center', flexWrap: 'wrap'}}>
          <button onClick={onDashboard} className="btn-secondary btn-small">
            {userMode === 'customer' ? '📋 My Jobs' : '📋 Job Board'}
          </button>
          
          <button onClick={onSettings} className="btn-secondary btn-small">
            ⚙️ Settings
          </button>
          
          <div className="notification-bell" onClick={onNotifications}>
            🔔
            {unreadCount > 0 && <span className="notification-count">{unreadCount}</span>}
          </div>
          
          <button onClick={showLanding} className="btn-banana btn-small">🏠 Home</button>
        </div>
      </div>
    </div>
  );
};

// ============ MAIN APP ============
const App = () => {
  const [userMode, setUserMode] = React.useState('customer');
  const [showLanding, setShowLanding] = React.useState(true);
  const [messages, setMessages] = React.useState([]);
  const [input, setInput] = React.useState("");
  const [isLoading, setIsLoading] = React.useState(false);
  const [ctx, setCtx] = React.useState({});
  const [conversationHistory, setConversationHistory] = React.useState([]);
  const [shownSchematics, setShownSchematics] = React.useState(new Set());
  const [notifications, setNotifications] = React.useState([]);
  const [showNotifications, setShowNotifications] = React.useState(false);
  const [showDashboard, setShowDashboard] = React.useState(false);
  const [showSettings, setShowSettings] = React.useState(false);
  const [activeJobPayment, setActiveJobPayment] = React.useState(null);
  const [toasts, setToasts] = React.useState([]);
  
  const messagesEndRef = React.useRef(null);
  const notificationPollRef = React.useRef(null);

  React.useEffect(() => {
    messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
  }, [messages]);

  React.useEffect(() => {
    if (!showLanding) {
      const pollUpdates = () => {
        // Simulate occasional notifications
        if (Math.random() > 0.7 && notifications.length < 10) {
          const newNotification = {
            id: Date.now(),
            title: 'New Job Available',
            message: 'A new snow removal job is available in your area!',
            timestamp: new Date().toISOString(),
            read: false,
            priority: 'medium'
          };
          setNotifications(prev => [newNotification, ...prev]);
          addToast('New notification: ' + newNotification.message, 'info');
        }
      };
      
      notificationPollRef.current = setInterval(pollUpdates, POLLING_INTERVAL);
      return () => clearInterval(notificationPollRef.current);
    }
  }, [showLanding, notifications.length]);

  const addToast = (message, type) => {
    const id = Date.now();
    setToasts(prev => [...prev, { id, message, type }]);
    setTimeout(() => {
      setToasts(prev => prev.filter(toast => toast.id !== id));
    }, 3000);
  };

  const startBooking = (serviceId = null) => {
    setShowLanding(false);
    setShowDashboard(false);
    setShowSettings(false);
    setCtx(serviceId ? {service_type: serviceId} : {});
    setConversationHistory([]);
    setShownSchematics(new Set());
    
    const welcome = userMode === 'customer'
      ? (serviceId ? `Great! Let's book ${serviceId.replace(/_/g, ' ')}. What's your address?` : "What service do you need?")
      : "Let's set up your helper profile. What's your full name?";
    
    setMessages([{ role: 'ai', text: welcome }]);
  };

  const handleSend = async (textOverride = null) => {
    const text = textOverride || input;
    if (!text.trim()) return;

    const userMsg = { role: 'user', text };
    setMessages(prev => [...prev, userMsg]);
    setInput("");
    setIsLoading(true);

    const updatedHistory = [...conversationHistory, userMsg];
    setConversationHistory(updatedHistory);

    try {
      // Simulate API call
      await new Promise(resolve => setTimeout(resolve, 1500));
      
      let responseText = '';
      let schematicData = null;
      let propertyData = null;
      let jobId = null;
      let jobStatus = null;
      let helperId = null;
      let confirmation = null;
      let notifiedHelpers = null;
      let requiresPayment = false;

      // AI response logic based on conversation context
      if (userMode === 'customer') {
        if (text.toLowerCase().includes('address') || text.includes('123')) {
          responseText = "Thanks! I found your property. Here are the details:";
          propertyData = {
            address: "123 Main St, Anytown, USA",
            square_feet: 2000,
            bedrooms: 3,
            bathrooms: 2,
            driveway_length_ft: 50
          };
        } else if (text.toLowerCase().includes('snow') || text.toLowerCase().includes('remove')) {
          responseText = "Perfect! When would you like the snow removal service?";
        } else if (text.toLowerCase().includes('tomorrow') || text.toLowerCase().includes('9')) {
          responseText = "Great! I've scheduled snow removal for tomorrow at 9 AM. Finding available helpers in your area...";
          schematicData = {
            type: 'snow_removal',
            property_data: { square_feet: 2000, driveway_length_ft: 50 },
            service_details: { type: 'snow_removal', date: 'Tomorrow', time: '9:00 AM' }
          };
          jobId = 'JOB_' + Math.floor(Math.random() * 10000);
          jobStatus = 'matched';
          notifiedHelpers = [
            { name: 'John Doe', distance_miles: 1.5, method: 'SMS' },
            { name: 'Mike Smith', distance_miles: 2.3, method: 'Email' }
          ];
        } else if (text.toLowerCase().includes('yes') || text.toLowerCase().includes('correct')) {
          responseText = "Excellent! I've notified nearby helpers. You'll receive a confirmation when a helper accepts your job.";
          confirmation = {
            helper_name: 'John Doe',
            service: 'Snow Removal',
            date: 'Tomorrow',
            time: '9:00 AM',
            location: '123 Main St',
            helper_payment: 70,
            admin_commission: 15,
            total_price: 85
          };
          requiresPayment = true;
        }
      } else {
        // Helper mode responses
        if (text.toLowerCase().includes('name')) {
          responseText = "Nice to meet you! What's your phone number?";
        } else if (text.toLowerCase().includes('phone') || text.includes('555')) {
          responseText = "Thanks! What services do you offer? (e.g., snow removal, lawn care)";
        } else if (text.toLowerCase().includes('snow') || text.toLowerCase().includes('lawn')) {
          responseText = "Perfect! Please upload photos of your equipment to complete your profile.";
          setCtx(prev => ({...prev, ready_for_photos: true}));
        }
      }

      const newMessage = {
        role: 'ai',
        text: responseText || "Thanks for your message! How can I help you further?",
        schematic: schematicData,
        property: propertyData,
        job_id: jobId,
        job_status: jobStatus,
        helper_id: helperId,
        confirmation: confirmation,
        notified_helpers: notifiedHelpers,
        requires_payment: requiresPayment
      };

      setMessages(prev => [...prev, newMessage]);

      if (requiresPayment && confirmation) {
        setActiveJobPayment({
          jobId: jobId,
          amount: confirmation.total_price
        });
      }

      setConversationHistory(prev => [...prev, { role: 'assistant', text: responseText }]);

    } catch (err) {
      console.error('API Error:', err);
      const errorMsg = "Sorry, there was an error. Please try again.";
      setMessages(prev => [...prev, { role: 'ai', text: errorMsg }]);
      addToast('Connection error. Please check your internet.', 'error');
    } finally {
      setIsLoading(false);
    }
  };

  const handlePaymentSuccess = (paymentIntent) => {
    addToast('Payment successful! Your job is confirmed.', 'success');
    setActiveJobPayment(null);
    
    setMessages(prev => [...prev, { 
      role: 'ai', 
      text: 'Payment confirmed! Your job is now scheduled. You\'ll receive a notification when your helper is on the way.' 
    }]);
  };

  const clearNotifications = () => {
    setNotifications([]);
  };

  const handlePhotoUpload = (fileUrl) => {
    setCtx(prev => ({...prev, uploaded_photos: [...(prev.uploaded_photos || []), fileUrl]}));
  };

  const handleGPSLocation = (address) => {
    setInput(address);
    setTimeout(() => {
      handleSend(address);
    }, 100);
  };

  const unreadCount = notifications.filter(n => !n.read).length;

  if (showLanding) {
    return (
      <div>
        <div style={{background: 'white', borderBottom: '2px solid var(--nano-black)', padding: '16px', position: 'sticky', top: 0, zIndex: 10}}>
          <div style={{maxWidth: '1200px', margin: '0 auto', display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '0 20px'}}>
            <div style={{display: 'flex', alignItems: 'center', gap: '8px'}}>
              <div style={{width: '36px', height: '36px', background: 'var(--banana-yellow)', borderRadius: '8px', border: '2px solid black', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '20px', fontWeight: 'bold'}}>N</div>
              <span style={{fontSize: '20px', fontWeight: 'bold'}}>NeighborTask V3</span>
            </div>
            <div style={{display: 'flex', gap: '12px', alignItems: 'center'}}>
              <button onClick={() => {
                const newMode = userMode === 'customer' ? 'helper' : 'customer';
                setUserMode(newMode);
              }} className="btn-banana btn-small">
                {userMode === 'customer' ? '🔧 Become a Helper' : '👤 Find Services'}
              </button>
            </div>
          </div>
        </div>
        
        <LandingPage onStartBooking={startBooking} mode={userMode} />
      </div>
    );
  }

  if (showDashboard) {
    return (
      <div style={{minHeight: '100vh', background: 'var(--paper-white)'}}>
        <Header 
          userMode={userMode}
          onBack={() => setShowDashboard(false)}
          onSettings={() => setShowSettings(true)}
          onNotifications={() => setShowNotifications(true)}
          unreadCount={unreadCount}
          showLanding={() => setShowLanding(true)}
        />
        <div style={{maxWidth: '1200px', margin: '0 auto', padding: '24px'}}>
          <JobDashboard 
            userId={userMode === 'customer' ? ctx.user_id : ctx.helper_id}
            userType={userMode}
            onBack={() => setShowDashboard(false)}
          />
        </div>
      </div>
    );
  }

  if (showSettings) {
    return (
      <div style={{minHeight: '100vh', background: 'var(--paper-white)'}}>
        <Header 
          userMode={userMode}
          onBack={() => setShowSettings(false)}
          onDashboard={() => setShowDashboard(true)}
          onNotifications={() => setShowNotifications(true)}
          unreadCount={unreadCount}
          showLanding={() => setShowLanding(true)}
        />
        <SettingsPanel 
          userType={userMode}
          userId={userMode === 'customer' ? ctx.user_id : ctx.helper_id}
          onClose={() => setShowSettings(false)}
        />
      </div>
    );
  }

  return (
    <div style={{minHeight: '100vh', display: 'flex', flexDirection: 'column', background: 'var(--paper-white)'}}>
      <Header 
        userMode={userMode}
        onBack={() => setShowLanding(true)}
        onDashboard={() => setShowDashboard(true)}
        onSettings={() => setShowSettings(true)}
        onNotifications={() => setShowNotifications(true)}
        unreadCount={unreadCount}
        showLanding={() => setShowLanding(true)}
      />

      <main style={{flex: 1, maxWidth: '800px', width: '100%', margin: '0 auto', padding: '16px', display: 'flex', flexDirection: 'column'}}>
        <div style={{flex: 1, overflowY: 'auto', marginBottom: '16px', padding: '8px'}}>
          {messages.map((msg, i) => (
            <div key={i} style={{display: 'flex', justifyContent: msg.role === 'ai' ? 'flex-start' : 'flex-end', marginBottom: '12px'}}>
              <div className={msg.role === 'ai' ? 'chat-bubble-ai' : 'chat-bubble-user'}>
                <div style={{whiteSpace: 'pre-wrap', lineHeight: '1.5'}}>{msg.text}</div>
                
                {msg.job_id && <div className="job-id-badge">Job #{msg.job_id}</div>}
                {msg.helper_id && <div className="helper-id-badge">Helper #{msg.helper_id}</div>}
                {msg.job_status && <JobStatus status={msg.job_status} />}
                
                {msg.property && !ctx.property_verified && (
                  <PropertyConfirmation
                    property={msg.property}
                    onConfirm={() => {
                      const newCtx = {...ctx, property_verified: true, property_data: msg.property};
                      setCtx(newCtx);
                      handleSend("yes", newCtx);
                    }}
                    onEdit={() => setMessages(prev => [...prev, {role: 'ai', text: 'What is the correct address?'}])}
                  />
                )}
                
                {msg.confirmation && <JobConfirmation details={msg.confirmation} />}
                {msg.notified_helpers && <NotifiedHelpers helpers={msg.notified_helpers} />}
                {msg.schematic && <SnowRemovalSchematic data={msg.schematic} />}
                
                {msg.requires_payment && !activeJobPayment && (
                  <button 
                    onClick={() => setActiveJobPayment({
                      jobId: msg.job_id,
                      amount: msg.confirmation?.total_price || 0
                    })}
                    className="btn-success"
                    style={{marginTop: '12px'}}
                  >
                    💳 Pay Now (${msg.confirmation?.total_price || 0})
                  </button>
                )}
              </div>
            </div>
          ))}

          {isLoading && (
            <div style={{display: 'flex'}}>
              <div className="chat-bubble-ai">
                <LoadingSpinner />
                <p style={{marginTop: '8px', fontSize: '14px', color: '#666'}}>Thinking...</p>
              </div>
            </div>
          )}

          {(ctx.ready_for_photos || ctx.ready_for_matching) && (
            <div style={{margin: '16px 0'}}>
              <PhotoUpload
                onUpload={handlePhotoUpload}
                userId={ctx.job_id || ctx.helper_id || "temp_" + Date.now()}
                userType={userMode}
                photoType={userMode === 'helper' ? 'equipment' : 'property'}
                label={userMode === 'helper' ? 'Upload Equipment Photos' : 'Upload Property Photos (optional)'}
                multiple={userMode === 'helper'}
              />
            </div>
          )}

          {activeJobPayment && (
            <PaymentForm
              amount={activeJobPayment.amount}
              jobId={activeJobPayment.jobId}
              onSuccess={handlePaymentSuccess}
              onCancel={() => setActiveJobPayment(null)}
            />
          )}

          <div ref={messagesEndRef} />
        </div>

        <LocationButton onLocationFound={handleGPSLocation} isLoading={isLoading} />

        <div className="card-nano" style={{padding: '8px', display: 'flex', gap: '8px'}}>
          <input
            value={input}
            onChange={e => setInput(e.target.value)}
            onKeyPress={e => e.key === 'Enter' && handleSend()}
            placeholder="Type your message..."
            style={{flex: 1, padding: '14px', border: 'none', outline: 'none', fontSize: '15px', background: 'transparent'}}
            disabled={!!activeJobPayment}
          />
          <button 
            onClick={() => handleSend()} 
            className="btn-banana" 
            style={{padding: '12px 20px'}}
            disabled={!!activeJobPayment}
          >
            Send
          </button>
        </div>
      </main>

      {showNotifications && (
        <NotificationsPanel
          notifications={notifications}
          onClose={() => setShowNotifications(false)}
          onClear={clearNotifications}
        />
      )}

      {toasts.map(toast => (
        <Toast
          key={toast.id}
          message={toast.message}
          type={toast.type}
          onClose={() => setToasts(prev => prev.filter(t => t.id !== toast.id))}
        />
      ))}
    </div>
  );
};

// ============ RENDER APP ============
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(
  <ErrorBoundary>
    <App />
  </ErrorBoundary>
);
</script>
</body>
</html>
