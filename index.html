const PhotoUpload = ({ onUpload, userId, userType, photoType, label }) => {
  const fileInputRef = useRef(null);
  const [uploading, setUploading] = useState(false);

  const handleFileChange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) {
      alert('Please select an image file');
      return;
    }
    setUploading(true);
    try {
      const reader = new FileReader();
      reader.onload = async (event) => {
        const base64Data = event.target.result.split(',')[1];
        const response = await fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            action: 'upload_equipment_photo',
            user_id: userId,
            user_type: userType,
            photo_type: photoType,
            photo_data: base64Data,
            file_name: file.name
          })
        });
        const data = await response.json();
        if (data.success) {
          onUpload(data.file_url);
          alert('Photo uploaded!');
        } else {
          alert('Upload failed: ' + data.error);
        }
        setUploading(false);
      };
      reader.readAsDataURL(file);
    } catch (err) {
      alert('Error: ' + err.message);
      setUploading(false);
    }
  };

  return (
    <div className="upload-area" onClick={() => fileInputRef.current?.click()}>
      <input ref={fileInputRef} type="file" accept="image/*" onChange={handleFileChange} />
      {uploading ? <div>Uploading...</div> : (
        <div>
          <div style={{fontSize: '32px', marginBottom: '8px'}}>📸</div>
          <div style={{fontWeight: 'bold'}}>{label || 'Upload photo'}</div>
        </div>
      )}
    </div>
  );
};

const LocationButton = ({ onLocationFound, isLoading }) => {
  const [locating, setLocating] = useState(false);

  const handleClick = () => {
    if (!navigator.geolocation) {
      alert("Geolocation is not supported by your browser");
      return;
    }

    setLocating(true);

    navigator.geolocation.getCurrentPosition(
      async (position) => {
        try {
          // 1. Get Coordinates from Browser
          const { latitude, longitude } = position.coords;
          
          // 2. Ask Backend to translate to Address (Reverse Geocode)
          const response = await fetch(BACKEND_URL, {
            method: 'POST',
            body: JSON.stringify({
              action: 'reverse_geocode',
              lat: latitude,
              lng: longitude
            })
          });
          
          const data = await response.json();
          
          if (data.success) {
            onLocationFound(data.address);
          } else {
            alert("Could not determine address: " + data.error);
          }
        } catch (error) {
          console.error(error);
          alert("Error getting location");
        } finally {
          setLocating(false);
        }
      },
      (error) => {
        alert("Unable to retrieve your location. Please allow location access.");
        setLocating(false);
      }
    );
  };

  return (
    <button 
      onClick={handleClick} 
      disabled={locating || isLoading}
      className="btn-small"
      style={{
        background: '#E0F2FE', 
        color: '#0284C7', 
        border: '1px solid #0284C7',
        borderRadius: '20px',
        padding: '8px 12px',
        cursor: 'pointer',
        display: 'flex',
        alignItems: 'center',
        gap: '6px',
        marginBottom: '10px',
        alignSelf: 'flex-end',
        fontSize: '12px'
      }}
    >
      {locating ? <span className="loader-dot"></span> : '📍'}
      {locating ? 'Locating...' : 'Use My Current Location'}
    </button>
  );
};

  const [input, setInput] = useState("");
  const [isLoading, setIsLoading] = useState(false);
  const [ctx, setCtx] = useState({});
  const [conversationHistory, setConversationHistory] = useState([]);
  const [shownSchematics, setShownSchematics] = useState(new Set());
  const messagesEndRef = useRef(null);

  // --- MEMORY PERSISTENCE FIX ---
  // Create a Reference to track context instantly
  const ctxRef = useRef({});

  // Keep ctxRef in sync with ctx state
  useEffect(() => {
    ctxRef.current = ctx;
  }, [ctx]);

  useEffect(() => {
    messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
  }, [messages]);

  const startBooking = (serviceId = null) => {
    setShowLanding(false);
    setCtx(serviceId ? {service_type: serviceId} : {});
    setConversationHistory([]);
    setShownSchematics(new Set());
    
    const welcome = userMode === 'customer'
      ? (serviceId ? `Great! Let's book ${serviceId.replace('_', ' ')}. What's your address?` : "What service do you need?")
      : "Let's set up your helper profile. What's your full name?";
    
    setMessages([{ role: 'ai', text: welcome }]);
  };

  // --- CORRECTED HANDLE SEND FUNCTION ---
  const handleSend = async (textOverride = null, tempContext = null) => {
    const text = textOverride || input;
    if (!text.trim()) return;

    // 1. Update UI immediately
    const userMsg = { role: 'user', text };
    setMessages(prev => [...prev, userMsg]);
    setInput("");
    setIsLoading(true);

    // 2. Update History
    const updatedHistory = [...conversationHistory, userMsg];
    setConversationHistory(updatedHistory);

    // 3. DETERMINE THE CORRECT CONTEXT TO SEND
    // If a button provided a tempContext (like "Correct"), use that. 
    // Otherwise use the live Ref (for typing).
    const contextToSend = tempContext || ctxRef.current;

    try {
      const response = await fetch(BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({
          action: 'chat',
          mode: userMode,
          message: text,
          context: contextToSend, // <--- CRITICAL FIX: Sends the correct memory
          history: updatedHistory
        })
      }).then(r => r.json());

      // 4. Handle Visuals (Schematics)
      let shouldShowSchematic = false;
      if (response.schematic_data) {
        const schematicKey = response.schematic_data.type;
        if (!shownSchematics.has(schematicKey)) {
          shouldShowSchematic = true;
          setShownSchematics(prev => new Set([...prev, schematicKey]));
        }
      }

      // 5. Update Messages with AI Response
      setMessages(prev => [...prev, {
        role: 'ai',
        text: response.text,
        schematic: shouldShowSchematic ? response.schematic_data : null,
        property: response.property,
        job_id: response.job_id,
        helper_id: response.helper_id
      }]);

      // 6. Update Context (Memory) if backend sends updates
      if (response.newContext) {
        setCtx(response.newContext);
      }

      setConversationHistory(prev => [...prev, { role: 'assistant', text: response.text }]);

    } catch (err) {
      console.error(err);
      // Fallback for demo/offline testing
      const mock = mockResponse(text, userMode, contextToSend);
      setMessages(prev => [...prev, { role: 'ai', text: "Backend Error (Using Mock): " + mock.text }]);
      if (mock.newContext) setCtx(mock.newContext);
    } finally {
      setIsLoading(false);
    }
  };

  const mockResponse = (msg, mode, context) => {
    if (mode === 'helper') {
      if (!context.helper_name) return { text: "What's your email and phone?", newContext: {...context} };
      return { text: "What services can you provide?", newContext: {...context} };
    }
    const low = msg.toLowerCase();
    if (low.includes('snow')) {
      return {
        text: "Found property at 123 Main St. Correct?",
        property: { address: '123 Main St', driveway_length_ft: 80, garage_spaces: 2, square_feet: 2000, bedrooms: 3, bathrooms: 2, stories: 1 },
        newContext: {...context, service_type: 'snow_removal'}
      };
    }
    return { text: "What service do you need?", newContext: {...context} };
  };

  const handlePhotoUpload = (fileUrl) => {
    setCtx(prev => ({...prev, uploaded_photos: [...(prev.uploaded_photos || []), fileUrl]}));
  };


  // PASTE THIS HERE:
  const handleGPSLocation = (address) => {
    setInput(address);
  };

  if (showLanding) {
    return (
      <div>
        {/* Header */}
        <div style={{background: 'white', borderBottom: '2px solid var(--nano-black)', padding: '16px', position: 'sticky', top: 0, zIndex: 10}}>
          <div style={{maxWidth: '1200px', margin: '0 auto', display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '0 20px'}}>
            <div style={{display: 'flex', alignItems: 'center', gap: '8px'}}>
              <div style={{width: '36px', height: '36px', background: 'var(--banana-yellow)', borderRadius: '8px', border: '2px solid black', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '20px', fontWeight: 'bold'}}>N</div>
              <span style={{fontSize: '20px', fontWeight: 'bold'}}>NeighborTask</span>
            </div>
            <button onClick={() => setUserMode(m => {
              const newMode = m === 'customer' ? 'helper' : 'customer';
              setShowLanding(true);
              return newMode;
            })} className="btn-banana btn-small">
              {userMode === 'customer' ? '🔧 Become a Helper' : '👤 Find Services'}
            </button>
          </div>
        </div>
        
        <LandingPage onStartBooking={startBooking} mode={userMode} />
      </div>
    );
  }

  // Chat Interface
  return (
    <div style={{minHeight: '100vh', display: 'flex', flexDirection: 'column', background: 'var(--paper-white)'}}>
      <div style={{background: 'white', borderBottom: '2px solid var(--nano-black)', padding: '16px', position: 'sticky', top: 0, zIndex: 10}}>
        <div style={{maxWidth: '48rem', margin: '0 auto', display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
          <div style={{display: 'flex', alignItems: 'center', gap: '8px'}}>
            <div style={{width: '36px', height: '36px', background: 'var(--banana-yellow)', borderRadius: '8px', border: '2px solid black', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '20px', fontWeight: 'bold'}}>N</div>
            <span style={{fontSize: '20px', fontWeight: 'bold'}}>NeighborTask</span>
          </div>
          <div style={{display: 'flex', gap: '8px'}}>
            <button onClick={() => setShowLanding(true)} className="btn-banana btn-small">← Back</button>
          </div>
        </div>
      </div>

      <main style={{flex: 1, maxWidth: '48rem', width: '100%', margin: '0 auto', padding: '16px', display: 'flex', flexDirection: 'column'}}>
        <div style={{flex: 1, overflowY: 'auto', marginBottom: '16px'}}>
          {messages.map((msg, i) => (
            <div key={i} style={{display: 'flex', justifyContent: msg.role === 'ai' ? 'flex-start' : 'flex-end'}}>
              <div className={msg.role === 'ai' ? 'chat-bubble-ai' : 'chat-bubble-user'}>
                <div style={{whiteSpace: 'pre-wrap', lineHeight: '1.5'}}>{msg.text}</div>
                {msg.job_id && <div className="job-id-badge">Job #{msg.job_id}</div>}
                {msg.helper_id && <div className="job-id-badge">Helper #{msg.helper_id}</div>}
                
                {/* --- CORRECTED PROPERTY CONFIRMATION LOGIC --- */}
                {msg.property && !ctx.property_verified && (
                  <PropertyConfirmation
                    property={msg.property}
                    onConfirm={() => {
                      const newCtx = {...ctx, property_verified: true}; 
                      setCtx(newCtx); 
                      handleSend("yes", newCtx); 
                    }}
                    onEdit={() => setMessages(prev => [...prev, {role: 'ai', text: 'What is the correct address?'}])}
                  />
                )}
                
                {msg.schematic?.type === 'snow_removal_schematic' && <SnowRemovalSchematic data={msg.schematic} />}
              </div>
            </div>
          ))}

          {isLoading && (
            <div style={{display: 'flex'}}>
              <div className="chat-bubble-ai">
                <div className="loader-dot"></div>
                <div className="loader-dot"></div>
                <div className="loader-dot"></div>
              </div>
            </div>
          )}

          {(ctx.ready_for_matching || ctx.helper_services) && (
            <div style={{margin: '16px 0'}}>
              <PhotoUpload
                onUpload={handlePhotoUpload}
                userId={ctx.job_id || ctx.helper_id || "temp_" + Date.now()}
                userType={userMode}
                photoType={userMode === 'helper' ? 'equipment' : 'property'}
                label={userMode === 'helper' ? 'Upload Equipment Photo' : 'Upload Property Photo (optional)'}
              />
            </div>
          )}

          <div ref={messagesEndRef} />
        </div>
        <LocationButton onLocationFound={handleGPSLocation} isLoading={isLoading} />

        <div className="card-nano" style={{padding: '8px', display: 'flex', gap: '8px'}}>
          <input
            value={input}
        <div className="card-nano" style={{padding: '8px', display: 'flex', gap: '8px'}}>
          <input
            value={input}
            onChange={e => setInput(e.target.value)}
            onKeyPress={e => e.key === 'Enter' && handleSend()}
            placeholder="Type your message..."
            style={{flex: 1, padding: '14px', border: 'none', outline: 'none', fontSize: '15px', background: 'transparent'}}
          />
          <button onClick={() => handleSend()} className="btn-banana" style={{padding: '12px 20px'}}>Send</button>
        </div>
      </main>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
